[workspace]
resolver = "2"
members = [ "photogram", "image_server", "photogram_wasm", "spherical_image", "ic_base", "ic_cache", "ic_camera", "ic_http", "ic_image", "ic_kernel", "ic_mapping", "ic_mesh", "ic_project", "ic_spherical_image", "ic_stars", "ic_threads", "ic_play", "indexed", "thunderclap"]

[workspace.package]
edition = "2024"
version = "0.1.0"
description = "Image analysis and photogrammetry\n"
homepage = "https://github.com/atthecodeface/image_calibrate"
documentation = "https://docs.rs/image_calibrate"
keywords = ["geometry"]
categories = ["graphics"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/atthecodeface/image_calibrate"

[workspace.dependencies]
ic_base = { version = "0.1.0", path = "./ic_base" }
ic_cache = { version = "0.1.0", path = "./ic_cache" }
ic_camera = { version = "0.1.0", path = "./ic_camera" }
ic_http = { version = "0.1.0", path = "./ic_http" }
ic_image = { version = "0.1.0", path = "./ic_image" }
ic_kernel = { version = "0.1.0", path = "./ic_kernel" }
ic_mapping = { version = "0.1.0", path = "./ic_mapping" }
ic_mesh = { version = "0.1.0", path = "./ic_mesh" }
ic_project = { version = "0.1.0", path = "./ic_project" }
ic_spherical_image = { version = "0.1.0", path = "./ic_spherical_image" }
ic_stars = { version = "0.1.0", path = "./ic_stars" }
ic_threads = { version = "0.1.0", path = "./ic_threads" }
ic_play = { version = "0.1.0", path = "./ic_play" }
indexed = { version = "0.1.0", path = "./indexed" }
thunderclap = { version = "0.1.0", path = "./thunderclap" }


[workspace.dependencies.anyhow]
version = "1.0.98"

[workspace.dependencies.bezier-nd]
version = "0.8"
path = "../../bezier-nd-rs"

[workspace.dependencies.bezier-wasm]
version = "0.8"
path = "../../bezier-wasm"

# Required for ic_kernel to cast slices to/from WGPU
[workspace.dependencies.bytemuck]
version = ">=1.15.0"
features = ["derive"]

[workspace.dependencies.clap]
version = "4.5.2"
features = ["string"]

[workspace.dependencies.geo-nd]
version = "0.8"
path = "../../geo-nd-rs"

[workspace.dependencies.geo-nd-wasm]
version = "0.8"
path = "../../geo-nd-wasm"

[workspace.dependencies.image]
version = "0.25"
features = ["png"]

# Used by ic_base for plane and ray matrix inverse
# Used by ic_camera for polynomial matrix inverse
[workspace.dependencies.nalgebra]
version = "0.32.1"

# For plots
[workspace.dependencies.poloto]
version = "19.1.2"

[workspace.dependencies.regex]
version = "1.11"

[workspace.dependencies.star-catalog]
version = "0.3"
features = ["postcard", "hipp_bright", "image"]
path = "../../star-catalog-rs"

[workspace.dependencies.tagu]
version = "0.1.3"

[workspace.dependencies.thiserror]
version = "2.0"

[workspace.dependencies.serde]
version = "1.0"
features = ["derive", "rc"]

[workspace.dependencies.serde_json]
version = "1.0.91"

[workspace.dependencies.wgpu]
version = "=0.20"

# indent-display = "0.1"
# lexer-rs = "0.0.3"
[workspace.dependencies.wasm-bindgen]
version = ">=0.2.92"

[workspace.dependencies.js-sys]
version = ">=0.3.64"

[workspace.dependencies.web-sys]
features = [
  'console',
  'CanvasRenderingContext2d',
  'Document',
  'EventTarget',
  'Element',
  'HtmlCanvasElement',
  'HtmlElement',
  'MouseEvent',
  'Window',
]
version = ">=0.3.40"
