<!doctype html>
<html lang="en-US">
    <head>
        <meta charset="utf-8" />
        <title>Image calibration File Browser</title>
    </head>
    <body>
        <link href="main.css" rel="stylesheet" type="text/css" />
        <script type="module" src="../javascript/photogram.js"></script>
        <div class="floating-div get_size_of_this">
            <!-- Will be fixed with edges at 0px on each side-->
            <div class="flex box">
                <div class="flex content">
                    <div id="webgl-canvas" class="set-size-of-this"></div>
                </div>
                <div class="flex footer"></div>
            </div>
        </div>

        <div class="fixed-div">
            <div id="tab-list" class="tab-list">
                This is cleared and then filled automatically
            </div>
            <div id="tab-help" class="main content">
                Help goes here
                <div>
                    <p>c</p>
                    <p>b</p>
                    <p>a</p>
                    <a
                        class="permit_interaction"
                        href=""
                        onclick="
                            {
                                console.log(event);
                                return false;
                            }
                        "
                        >Item</a
                    >
                </div>
            </div>
            <div id="tab-browser" class="main content">
                <div id="browser"></div>
            </div>
            <div id="tab-star-calibration" class="main content fixed-content">
                <div id="star_calibration"></div>
            </div>
            <div id="tab-project-edit" class="main content">
                <div class="set-to-size-of-tab-list"></div>
                <div id="project_edit">
                    <h2>
                        Project source: <span class="set-project-name"></span>
                    </h2>
                </div>
            </div>
            <div id="tab-lens-calibration-plot" class="main content">
                Current CIP:
                <span class="set-cip-name"></span>
                <p></p>
                Body:
                <span class="set-body"></span>
                <p></p>
                Lens:
                <span class="set-lens"></span>
                <p></p>
                Focal length:
                <span class="set-focal-length"></span>
                <p></p>
                FOV:
                <span class="set-fovd"></span>diagonal,
                <span class="set-fovh"></span>horizontal
                <p></p>
                <div id="lens_calibration_plot"></div>
            </div>
            <div id="tab-undo" class="main content">
                <div id="undo"></div>
            </div>
            <div id="tab-log" class="main content">
                <table>
                    <div id="Log"></div>
                </table>
            </div>
        </div>
    </body>
</html>
